[project]
name = "network-propagation-containment"
version = "0.1.0"
description = "A safe network propagation simulator for studying topology-based containment."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
